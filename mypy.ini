[mypy]
# Global options
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_any_unimported = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Note: Django plugins are commented out to avoid initialization issues
# Uncomment when running mypy in a full Django environment with all dependencies installed
# plugins = mypy_django_plugin.main, mypy_drf_plugin.main
#
# [mypy.plugins.django-stubs]
# django_settings_module = ocpiconnector.settings.dev

# Exclude patterns
exclude = (?x)(
    ^migrations/
    | ^venv/
    | ^\.venv/
    | ^build/
    | ^dist/
    | ^\.git/
    | ^\.mypy_cache/
    | ^\.pytest_cache/
    | ^\.tox/
    | ^node_modules/
    | ^templates/
    | ^static/
    | ^ocpiconnector/static/
  )

# Third-party libraries without stubs
[mypy-celery.*]
ignore_missing_imports = True

[mypy-paho.*]
ignore_missing_imports = True

