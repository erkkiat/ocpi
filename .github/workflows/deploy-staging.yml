name: Build and Push to Staging ECR

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: html-coverage-report
          path: htmlcov/

  build-and-push-staging:
    runs-on: ubuntu-latest
    needs: test

    env:
      ECR_REPO_URL: ${{ secrets.SMP_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_ECR_REGION }}.amazonaws.com
      IMAGE_TAG: staging-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region:  ${{ secrets.SMP_AWS_REGION }}
          role-to-assume: ${{ secrets.SMP_AWS_GHA_ROLE}}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Staging Images
        run: |
          for service in django-app mqtt-subscriber celery-mqtt celery-django; do
            full_image_url = $ECR_REPO_URL/solidroam-$service-f3:${IMAGE_TAG}
            docker build -t "${full_image_url}" -f ./ocpiconnector/Dockerfile ./ocpiconnector/
            docker push "${full_image_url}"
          done
