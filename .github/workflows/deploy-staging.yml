name: Build and Push to Staging ECR

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  lint:
    name: Lint Code
    environment: staging
    runs-on: ubuntu-latest-m
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up virtual environment
        run: uv venv .venv

      - name: Install test dependencies
        run: uv sync --test --frozen

      - name: Run Ruff Linting
        run: uv run ruff check .

  test:
    name: Run Tests
    environment: staging
    runs-on: ubuntu-latest-m
    needs: lint
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up virtual environment
        run: uv venv .venv

      - name: Install test dependencies
        run: uv sync --test --frozen

      - name: Run Pytest
        run: uv run pytest

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: HTML Coverage Report
          path: htmlcov/

  build-and-push-staging:
    name: Build and Push Docker Image to Staging ECR
    environment: staging
    runs-on: ubuntu-latest-m
    needs: test
    if: github.event_name == 'push'

    env:
      ECR_REPO_URL: ${{ secrets.SMP_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_AWS_REGION }}.amazonaws.com
      FARMS: "f3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SMP_AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker Image Tag
        id: set_tag
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/refs\/heads\///' | tr '/' '-')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          IMAGE_TAG="${BRANCH_NAME}-${COMMIT_HASH}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Build Base Image Once
        run: |
          echo "Building base image once with tag: $IMAGE_TAG"
          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" \
            -f ./Dockerfile \
            --cache-from=type=gha,scope=staging-build \
            --cache-to=type=gha,mode=max,scope=staging-build \
            --load .

      - name: Tag and Push Base Image to Each Farm
        run: |
          for farm in $FARMS; do
              repo_url="$ECR_REPO_URL/solidroam-django-app-$farm"
              full_image_url_with_tag="$repo_url:$IMAGE_TAG"

              echo "Tagging base image for farm $farm..."
              docker tag "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" "$full_image_url_with_tag"

              echo "Pushing image to ECR: $full_image_url_with_tag"
              docker push "$full_image_url_with_tag"

              echo "✅ Pushed image for farm $farm: $full_image_url_with_tag"
          done
