name: Staging Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pwd
          ls -al
          pip install -r ocpiconnector/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: html-coverage-report
          path: htmlcov/

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Test Images
        run: |
          docker build -t test-image ./ocpiconnector/Dockerfile ./ocpiconnector/
          docker run --rm test-image pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    env:
      DOCKER_REGISTRY: solidroam
      IMAGE_TAG: staging-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Images
        run: |
          docker build -t $DOCKER_REGISTRY/django-app:$IMAGE_TAG -f ./ocpiconnector/Dockerfile ./ocpiconnector/
          docker push $DOCKER_REGISTRY/django-app:$IMAGE_TAG
          docker build -t $DOCKER_REGISTRY/mqtt-subscriber:$IMAGE_TAG -f ./ocpiconnector/Dockerfile ./ocpiconnector/
          docker push $DOCKER_REGISTRY/mqtt-subscriber:$IMAGE_TAG
          docker build -t $DOCKER_REGISTRY/celery-mqtt:$IMAGE_TAG -f ./ocpiconnector/Dockerfile ./ocpiconnector/
          docker push $DOCKER_REGISTRY/celery-mqtt:$IMAGE_TAG
          docker build -t $DOCKER_REGISTRY/celery-django:$IMAGE_TAG -f ./ocpiconnector/Dockerfile ./ocpiconnector/
          docker push $DOCKER_REGISTRY/celery-django:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging EC2 Instance
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd ocpiconnector/docker-composes
            docker-compose -f docker-compose-prod.yml pull
            docker-compose -f docker-compose-prod.yml run django-server python manage.py migrate --noinput
            docker-compose -f docker-compose-prod.yml up -d
            docker system prune -f
