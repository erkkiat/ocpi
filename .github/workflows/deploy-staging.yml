name: Build and Push to Staging ECR

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  lint:
    name: Lint Code
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    environment: staging
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: HTML Coverage Report
          path: htmlcov/

  build-and-push-staging:
    name: Build and Push Multi-Architecture Docker Images to Staging
    environment: staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    env:
      ECR_REPO_URL: ${{ secrets.SMP_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Version
        run: docker --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SMP_AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker Image Tag
        id: set_tag
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/refs\/heads\///' | tr '/' '-')
          PR_NUMBER=${{ github.event.pull_request.number || 'nopr' }}
          COMMIT_HASH=$(git rev-parse --short HEAD)
          IMAGE_TAG="${BRANCH_NAME}-${PR_NUMBER}-${COMMIT_HASH}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Build and Push Multi-Architecture Images
        run: |
          FARMS="f2 f3"

          echo "Deploying to farms: $FARMS"

          for service in django-app mqtt-subscriber celery-mqtt celery-django; do
              echo "Building multi-architecture image for $service with tag: $IMAGE_TAG"
              docker buildx build --platform linux/arm64 -t "$ECR_REPO_URL/solidroam-$service:$IMAGE_TAG" -f ./Dockerfile --load .
              for farm in $FARMS; do
                  repo_url="$ECR_REPO_URL/solidroam-$service-$farm"
                  full_image_url_with_tag="$repo_url:$IMAGE_TAG"

                  echo "Tagging image for $service to $repo_url"
                  docker tag "$ECR_REPO_URL/solidroam-$service:$IMAGE_TAG" "$full_image_url_with_tag"

                  echo "Pushing image for $service to $repo_url"
                  docker push "$full_image_url_with_tag"

                  echo "Pushed image for $service to ECR: $full_image_url_with_tag"
              done
          done
