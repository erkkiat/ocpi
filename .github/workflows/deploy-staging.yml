name: Build and Push to Staging

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

# ── Tag strategy (Cloud Run, single repo solidroam/solidroam-app) ──────────
# <branch>-<sha>   immutable — used for all deploys and rollbacks
# Production promotion re-tags the same immutable sha — no rebuild.
# ──────────────────────────────────────────────────────────────────────────

jobs:

  lint:
    name: Lint Code
    environment: staging
    runs-on: linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    environment: staging
    runs-on: linux-arm64
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest in Parallel
        run: pytest -n auto

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: HTML Coverage Report
          path: htmlcov/

  test-amd64:
    name: Run Tests (amd64 / Cloud Run)
    environment: staging
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest in Parallel
        run: pytest -n auto

  set-tag:
    name: Set Image Tag
    runs-on: linux-arm64
    needs: [lint, test, test-amd64]
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
      deploy_id: ${{ steps.set_tag.outputs.deploy_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Derive tag and deploy ID
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/refs\/heads\///' | tr '/' '-')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          IMAGE_TAG="${BRANCH_NAME}-${COMMIT_HASH}"
          DEPLOYID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "deploy_id=${DEPLOYID}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "DEPLOYID=${DEPLOYID}"

  build-staging-aws:
    name: Build and Push Docker Image to Staging ECR
    environment: staging
    runs-on: linux-arm64
    needs: [set-tag]
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ needs.set-tag.outputs.image_tag }}
      deploy_id: ${{ needs.set-tag.outputs.deploy_id }}

    env:
      AWS_REGION: ${{ secrets.SMAPPEE_AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.SMAPPEE_AWS_ACCOUNT_ID }}
      ECR_REPO_URL: ${{ secrets.SMAPPEE_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMAPPEE_AWS_REGION }}.amazonaws.com
      FARMS: "f3"
      AWS_PAGER: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SMAPPEE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.SMAPPEE_AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image to Each Farm
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.set-tag.outputs.image_tag }}"

          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_REPO_URL/solidroam-base:${IMAGE_TAG}" \
            -f ./Dockerfile \
            --cache-from=type=gha,scope=staging-build \
            --cache-to=type=gha,mode=max,scope=staging-build \
            --load .

          for farm in $FARMS; do
            full_image_url_with_tag="$ECR_REPO_URL/solidroam-django-app-$farm:${IMAGE_TAG}"
            docker tag "$ECR_REPO_URL/solidroam-base:${IMAGE_TAG}" "$full_image_url_with_tag"
            docker push "$full_image_url_with_tag"
            echo "✅ Pushed image for farm $farm: $full_image_url_with_tag"
          done

  deploy-staging-aws:
    name: Deploy to Staging via SSM
    environment: staging
    runs-on: linux-arm64
    needs: build-staging-aws
    if: github.event_name == 'push'

    env:
      AWS_REGION: ${{ secrets.SMAPPEE_AWS_REGION }}
      SSM_DOCUMENT_NAME: Solidroam-GHA-Deployment
      TARGET_TAG_COMPONENT: solidroam
      TARGET_TAG_STAGE: farm3
      AWS_PAGER: ""
      IMAGE_TAG: ${{ needs.build-staging-aws.outputs.image_tag }}
      DEPLOYID: ${{ needs.build-staging-aws.outputs.deploy_id }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SMAPPEE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.SMAPPEE_AWS_REGION }}

      - name: Deploy to farm3 via SSM
        id: ssm_deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "Sending SSM deploy: IMAGETAG=${IMAGE_TAG}, DEPLOYID=${DEPLOYID}"
          echo "Target tags: component=${TARGET_TAG_COMPONENT}, stage=${TARGET_TAG_STAGE}"
          echo "Document: ${SSM_DOCUMENT_NAME}"
          echo "Region: ${AWS_REGION}"

          COMMAND_ID=$(
            aws ssm send-command \
              --document-name "${SSM_DOCUMENT_NAME}" \
              --targets "Key=tag:component,Values=${TARGET_TAG_COMPONENT}" "Key=tag:stage,Values=${TARGET_TAG_STAGE}" \
              --max-concurrency "1" \
              --max-errors "0" \
              --comment "staging deploy ${IMAGE_TAG} (${DEPLOYID})" \
              --parameters "{\"IMAGETAG\":[\"${IMAGE_TAG}\"],\"DEPLOYID\":[\"${DEPLOYID}\"]}" \
              --region "${AWS_REGION}" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM CommandId=${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          TIMEOUT_SECONDS=300
          POLL_INTERVAL=10
          DEADLINE=$((SECONDS + TIMEOUT_SECONDS))

          while true; do
            STATUS=$(
              aws ssm list-command-invocations \
                --command-id "${COMMAND_ID}" \
                --details \
                --region "${AWS_REGION}" \
                --query "CommandInvocations[0].Status" \
                --output text
            )

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment reached terminal failure state: ${STATUS}"
                exit 1
                ;;
              Pending|InProgress|Delayed|Cancelling)
                if (( SECONDS >= DEADLINE )); then
                  echo "Deployment did not finish within ${TIMEOUT_SECONDS}s (5 minutes)."
                  exit 1
                fi
                sleep "${POLL_INTERVAL}"
                ;;
              ""|None)
                echo "Waiting for command invocation to appear (AWS eventual consistency)..."
                if (( SECONDS >= DEADLINE )); then
                  echo "Command invocation never appeared within ${TIMEOUT_SECONDS}s."
                  exit 1
                fi
                sleep "${POLL_INTERVAL}"
                ;;
              *)
                echo "Unexpected SSM status: ${STATUS}"
                exit 1
                ;;
            esac
          done

      - name: Show Deployment Logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.ssm_deploy.outputs.command_id }}"
          if [[ -z "${COMMAND_ID}" ]]; then
            echo "No COMMAND_ID captured (send-command likely failed)."
            exit 0
          fi

          echo "=== SSM Logs (CommandId=${COMMAND_ID}) ==="

          INSTANCE_IDS=$(
            aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --region "${AWS_REGION}" \
              --query "CommandInvocations[].InstanceId" \
              --output text
          )

          for iid in ${INSTANCE_IDS}; do
            data=$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${iid}" \
                --region "${AWS_REGION}" \
                --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output json || true
            )
            echo
            echo "----- ${iid} -----"
            echo "$data" | jq -r '
              "Status: \(.Status) (\(.StatusDetails // "n/a")), RC: \(.ResponseCode // "n/a")",
              "STDOUT:\n\(.Stdout // "")\n\nSTDERR:\n\(.Stderr // "")"
            '
          done

      - name: Create Sentry Release (staging)
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: staging
          release: ${{ env.IMAGE_TAG }}
          set_commits: auto
          finalize: true

  build-staging-gcp:
    name: Build and Push Docker Image to GCP Artifact Registry
    environment: staging
    runs-on: ubuntu-latest
    needs: [set-tag]
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ needs.set-tag.outputs.image_tag }}

    env:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REPO: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/solidroam-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.set-tag.outputs.image_tag }}"

          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=gha,scope=cloud-run-build \
            --cache-to=type=gha,mode=max,scope=cloud-run-build \
            -f ./Dockerfile \
            -t "${IMAGE_REPO}:${IMAGE_TAG}" \
            --push .

          echo "✅ Pushed ${IMAGE_REPO}:${IMAGE_TAG}"

  migrate-staging-gcp:
    name: Run Django Migrations on Cloud Run
    environment: staging
    runs-on: ubuntu-latest
    needs: build-staging-gcp
    if: github.event_name == 'push'

    env:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/solidroam-app:${{ needs.build-staging-gcp.outputs.image_tag }}

    steps:
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run migrations as Cloud Run Job
        run: |
          set -euo pipefail
          gcloud run jobs deploy solidroam-migrate-staging \
            --image="${IMAGE}" \
            --entrypoint="python" \
            --args="manage.py,migrate,--noinput" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          gcloud run jobs execute solidroam-migrate-staging \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --wait \
            --quiet

  deploy-staging-gcp:
    name: Deploy ${{ matrix.service }} to Cloud Run
    environment: staging
    runs-on: ubuntu-latest
    needs: [build-staging-gcp, migrate-staging-gcp]
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: solidroam-django-staging
            command: django-app
          - service: solidroam-celery-django-staging
            command: celery-django

    env:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      # Always deploy the immutable commit-pinned tag
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/solidroam-app:${{ needs.build-staging-gcp.outputs.image_tag }}

    steps:
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy ${{ matrix.service }} to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy ${{ matrix.service }} \
            --image="${IMAGE}" \
            --args="${{ matrix.command }}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --platform=managed \
            --allow-unauthenticated \
            --quiet

      - name: Show deployed service URL
        run: |
          gcloud run services describe ${{ matrix.service }} \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format="value(status.url)"
