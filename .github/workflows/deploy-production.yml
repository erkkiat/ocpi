name: Develop to Main Release Workflow

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest-m
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest-m
    needs: lint
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest in Parallel
        run: pytest -n auto

  tag-and-release-draft:
    name: Create Draft Release
    runs-on: ubuntu-latest-m
    needs: test
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Draft Release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Release Tag
        run: |
          RELEASE_TAG="${{ steps.draft_release.outputs.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            echo "Error: Release tag missing!"
            exit 1
          fi
          echo "$RELEASE_TAG" > release_tag.txt

      - name: Upload Release Data
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release_tag.txt

  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest-m
    needs: tag-and-release-draft

    env:
      ECR_REPO_URL: ${{ secrets.SMP_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_AWS_REGION }}.amazonaws.com
      FARMS: "f1"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Release Tag
        uses: actions/download-artifact@v4
        with:
          name: release-tag

      - name: Read Release Tag
        run: |
          IMAGE_TAG=$(cat release_tag.txt)
          if [ -z "$IMAGE_TAG" ]; then
            echo "Error: No release tag found!"
            exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SMP_AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Base Image Once
        run: |
          echo "Building base image once with tag: $IMAGE_TAG"
          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" \
            -f ./Dockerfile \
            --cache-from=type=gha,scope=prod-build \
            --cache-to=type=gha,mode=max,scope=prod-build \
            --load .

      - name: Tag and Push Base Image to Production Farm
        run: |
          for farm in $FARMS; do
              repo_url="$ECR_REPO_URL/solidroam-django-app-$farm"
              full_image_url_with_tag="$repo_url:$IMAGE_TAG"

              echo "Tagging base image for farm $farm..."
              docker tag "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" "$full_image_url_with_tag"

              echo "Pushing image to ECR: $full_image_url_with_tag"
              docker push "$full_image_url_with_tag"

              echo "✅ Pushed image for farm $farm: $full_image_url_with_tag"
          done

  publish-release:
    name: Tag and Publish GitHub Release
    runs-on: ubuntu-latest-m
    needs: build-and-deploy
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download Release Tag
        uses: actions/download-artifact@v4
        with:
          name: release-tag

      - name: Read Release Tag
        run: echo "RELEASE_TAG=$(cat release_tag.txt)" >> $GITHUB_ENV

      - name: Push Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create Sentry Release (production)
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ env.RELEASE_TAG }}

      - name: Publish Draft Release
        run: |
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh release edit "$RELEASE_TAG" --draft=false
