name: Develop to Main Release Workflow

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest-m
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest-m
    needs: lint
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Pytest
        run: pytest

  tag-and-release-draft:
    name: Create Draft Release
    runs-on: ubuntu-latest-m
    needs: test  # Ensure tests pass before creating the draft release
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create/Update Draft Release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Save Release Tag
        run: |
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          RELEASE_TAG=$(gh release view --json tagName -q ".tagName")
          echo "Using draft release tag: $RELEASE_TAG"
          echo "$RELEASE_TAG" > release_tag.txt

      - name: Upload Release Tag
        uses: actions/upload-artifact@v3
        with:
          name: release-tag
          path: release_tag.txt

  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest-m
    needs: tag-and-release-draft  # Ensure we have a draft release first

    env:
      ECR_REPO_URL: ${{ secrets.SMP_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_AWS_REGION }}.amazonaws.com
      FARMS: "f1"  # Production farm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Release Tag
        uses: actions/download-artifact@v3
        with:
          name: release-tag

      - name: Read Release Tag
        run: echo "IMAGE_TAG=$(cat release_tag.txt)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SMP_AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Base Image Once
        run: |
          echo "Building base image once with tag: $IMAGE_TAG"
          docker buildx build --platform linux/arm64 -t "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" -f ./Dockerfile --load .

      - name: Tag and Push Multi-Architecture Images for Each Service
        run: |
          echo "Deploying to farms: $FARMS"

          for service in django-app mqtt-subscriber celery-mqtt celery-django; do
              echo "Tagging image for $service from the base image"
              docker tag "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" "$ECR_REPO_URL/solidroam-$service:$IMAGE_TAG"

              for farm in $FARMS; do
                  repo_url="$ECR_REPO_URL/solidroam-$service-$farm"
                  full_image_url_with_tag="$repo_url:$IMAGE_TAG"

                  echo "Tagging image for farm $farm"
                  docker tag "$ECR_REPO_URL/solidroam-$service:$IMAGE_TAG" "$full_image_url_with_tag"

                  echo "Pushing image for $service to $repo_url"
                  docker push "$full_image_url_with_tag"

                  echo "Pushed image for $service to ECR: $full_image_url_with_tag"
              done
          done

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest-m
    needs: build-and-deploy  # Ensure deployment succeeds before publishing the release

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download Release Tag
        uses: actions/download-artifact@v4
        with:
          name: release-tag

      - name: Read Release Tag
        run: echo "RELEASE_TAG=$(cat release_tag.txt)" >> $GITHUB_ENV

      - name: Publish GitHub Release
        run: |
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh release edit "$RELEASE_TAG" --draft=false
