name: Build and Push to Production ECR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: read

jobs:
  lint:
    name: Lint Code
    environment: production
    runs-on: linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    environment: production
    runs-on: linux-arm64
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest in Parallel
        run: pytest -n auto

  tag-and-release-draft:
    name: Create Draft Release
    environment: production
    runs-on: linux-arm64
    needs: [lint, test]
    outputs:
      release_tag: ${{ steps.draft_release.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Draft Release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Release Tag
        if: github.event_name == 'push'
        run: |
          RELEASE_TAG="${{ steps.draft_release.outputs.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            echo "Error: Release tag missing!"
            exit 1
          fi
          echo "Release tag created: $RELEASE_TAG"

  build-production:
    name: Build and Push Docker Image to Production ECR
    environment: production
    runs-on: linux-arm64
    needs: tag-and-release-draft
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ needs.tag-and-release-draft.outputs.release_tag }}
      deploy_id: ${{ steps.set_tag.outputs.deploy_id }}

    env:
      AWS_REGION: ${{ secrets.SMAPPEE_AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.SMAPPEE_AWS_ACCOUNT_ID }}
      ECR_REPO_URL: ${{ secrets.SMAPPEE_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMAPPEE_AWS_REGION }}.amazonaws.com
      FARMS: "f1"
      AWS_PAGER: ""
      IMAGE_TAG: ${{ needs.tag-and-release-draft.outputs.release_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SMAPPEE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.SMAPPEE_AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Deploy ID
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "deploy_id=${DEPLOYID}" >> $GITHUB_OUTPUT

          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "DEPLOYID=${DEPLOYID}"

      - name: Build Base Image Once
        run: |
          set -euo pipefail
          echo "Building base image once with tag: $IMAGE_TAG"
          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" \
            -f ./Dockerfile \
            --cache-from=type=gha,scope=prod-build \
            --cache-to=type=gha,mode=max,scope=prod-build \
            --load .

      - name: Tag and Push Base Image to Each Farm
        run: |
          set -euo pipefail
          for farm in $FARMS; do
              repo_url="$ECR_REPO_URL/solidroam-django-app-$farm"
              full_image_url_with_tag="$repo_url:$IMAGE_TAG"

              echo "Tagging base image for farm $farm..."
              docker tag "$ECR_REPO_URL/solidroam-base:$IMAGE_TAG" "$full_image_url_with_tag"

              echo "Pushing image to ECR: $full_image_url_with_tag"
              docker push "$full_image_url_with_tag"

              echo "✅ Pushed image for farm $farm: $full_image_url_with_tag"
          done

  deploy-production:
    name: Deploy to Production via SSM
    environment: production
    runs-on: linux-arm64
    needs: build-production
    if: github.event_name == 'push'
    
    env:
      AWS_REGION: ${{ secrets.SMAPPEE_AWS_REGION }}
      SSM_DOCUMENT_NAME: Solidroam-GHA-Deployment
      TARGET_TAG_COMPONENT: solidroam
      TARGET_TAG_STAGE: farm1
      AWS_PAGER: ""
      IMAGE_TAG: ${{ needs.build-production.outputs.image_tag }}
      DEPLOYID: ${{ needs.build-production.outputs.deploy_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SMAPPEE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.SMAPPEE_AWS_REGION }}

      - name: Deploy to farm1 via SSM
        id: ssm_deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "Sending SSM deploy: IMAGETAG=${IMAGE_TAG}, DEPLOYID=${DEPLOYID}"
          echo "Target tags: component=${TARGET_TAG_COMPONENT}, stage=${TARGET_TAG_STAGE}"
          echo "Document: ${SSM_DOCUMENT_NAME}"
          echo "Region: ${AWS_REGION}"

          COMMAND_ID=$(
            aws ssm send-command \
              --document-name "${SSM_DOCUMENT_NAME}" \
              --targets "Key=tag:component,Values=${TARGET_TAG_COMPONENT}" "Key=tag:stage,Values=${TARGET_TAG_STAGE}" \
              --max-concurrency "1" \
              --max-errors "0" \
              --comment "production deploy ${IMAGE_TAG} (${DEPLOYID})" \
              --parameters "{\"IMAGETAG\":[\"${IMAGE_TAG}\"],\"DEPLOYID\":[\"${DEPLOYID}\"]}" \
              --region "${AWS_REGION}" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM CommandId=${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          # ---- 5-minute bounded wait for terminal state ----
          TIMEOUT_SECONDS=300
          POLL_INTERVAL=10
          DEADLINE=$((SECONDS + TIMEOUT_SECONDS))

          while true; do
            STATUS=$(
              aws ssm list-command-invocations \
                --command-id "${COMMAND_ID}" \
                --details \
                --region "${AWS_REGION}" \
                --query "CommandInvocations[0].Status" \
                --output text
            )

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment reached terminal failure state: ${STATUS}"
                exit 1
                ;;
              Pending|InProgress|Delayed|Cancelling)
                if (( SECONDS >= DEADLINE )); then
                  echo "Deployment did not finish within ${TIMEOUT_SECONDS}s (5 minutes)."
                  exit 1
                fi
                sleep "${POLL_INTERVAL}"
                ;;
              ""|None)
                echo "Waiting for command invocation to appear (AWS eventual consistency)..."
                if (( SECONDS >= DEADLINE )); then
                  echo "Command invocation never appeared within ${TIMEOUT_SECONDS}s."
                  exit 1
                fi
                sleep "${POLL_INTERVAL}"
                ;;
              *)
                echo "Unexpected SSM status: ${STATUS}"
                exit 1
                ;;
            esac
          done

      - name: Show Deployment Logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.ssm_deploy.outputs.command_id }}"
          if [[ -z "${COMMAND_ID}" ]]; then
            echo "No COMMAND_ID captured (send-command likely failed)."
            exit 0
          fi
          
          echo "=== SSM Logs (CommandId=${COMMAND_ID}) ==="
          
          INSTANCE_IDS=$(
            aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --region "${AWS_REGION}" \
              --query "CommandInvocations[].InstanceId" \
              --output text
          )
          
          for iid in ${INSTANCE_IDS}; do
            data=$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${iid}" \
                --region "${AWS_REGION}" \
                --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output json || true
            )
          
            echo
            echo "----- ${iid} -----"
            echo "$data" | jq -r '
              "Status: \(.Status) (\(.StatusDetails // "n/a")), RC: \(.ResponseCode // "n/a")",
              "STDOUT:\n\(.Stdout // "")\n\nSTDERR:\n\(.Stderr // "")"
            '
          done

      - name: Create Sentry Release (production)
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{ env.IMAGE_TAG }}
          set_commits: auto
          finalize: true

  publish-release:
    name: Tag and Publish GitHub Release
    environment: production
    runs-on: linux-arm64
    needs: [build-production, deploy-production]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Release Tag
        run: echo "RELEASE_TAG=${{ needs.build-production.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Push Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish Draft Release
        run: |
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh release edit "$RELEASE_TAG" --draft=false
