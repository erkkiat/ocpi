name: Deploy Production Build to Staging and Production

on:
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: html-coverage-report
          path: htmlcov/

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and Push Production Images
        run: |
          ECR_REPO_URL=${{ steps.login-ecr.outputs.registry }}
          for service in django-app mqtt-subscriber celery-mqtt celery-django; do
            docker build -t $ECR_REPO_URL/$service:${IMAGE_TAG} -f ./ocpiconnector/Dockerfile ./ocpiconnector/
            docker push $ECR_REPO_URL/$service:${IMAGE_TAG}
          done

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Staging EC2 Instance
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets '[{"Key":"InstanceIds","Values":["${{ secrets.STAGING_INSTANCE_ID }}"]}]' \
            --parameters '{"commands":["
              export ECR_REPO_URL=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
              export IMAGE_TAG=${{ github.event.release.tag_name }}
              cd /path/to/docker-composes
              docker-compose -f docker-compose-staging.yml pull
              docker-compose -f docker-compose-staging.yml run django-server python manage.py migrate --noinput
              docker-compose -f docker-compose-staging.yml up -d
              docker system prune -f
            "]}' \
            --region ${{ secrets.AWS_REGION }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Deploy to Production EC2 Instance
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets '[{"Key":"InstanceIds","Values":["${{ secrets.PRODUCTION_INSANCE_ID }}"]}]' \
            --parameters '{"commands":["
              export ECR_REPO_URL=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
              export IMAGE_TAG=${{ github.event.release.tag_name }}
              cd /path/to/docker-composes
              docker-compose -f docker-compose-prod.yml pull
              docker-compose -f docker-compose-prod.yml run django-server python manage.py migrate --noinput
              docker-compose -f docker-compose-prod.yml up -d
              docker system prune -f
            "]}' \
            --region ${{ secrets.AWS_REGION }}
