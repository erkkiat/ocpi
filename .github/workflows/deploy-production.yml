name: Develop to Master Release Workflow

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint  # Run tests only if linting succeeds
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Pytest
        run: pytest

  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    needs: test  # Run only if tests succeed

    env:
      ECR_REPO_URL: ${{ secrets.SMP_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SMP_AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images
        run: |
          IMAGE_TAG=$(date +%Y-%m-%d)-$GITHUB_RUN_NUMBER
          repo_url="$ECR_REPO_URL/solidroam-$service-f1"
          full_image_url_with_tag="$repo_url:$IMAGE_TAG"

          for service in django-app mqtt-subscriber celery-mqtt celery-django; do
              echo "Building multi-architecture image for $service with tag: $IMAGE_TAG"
              docker buildx build --platform linux/arm64 -t "$full_image_url_with_tag" -f ./Dockerfile --push .
              echo "Pushed $service:$IMAGE_TAG to ECR farm $FARM."
          done

      - name: Set Release Tag
        run: echo "RELEASE_VERSION=$(date +%Y-%m-%d)-$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

  tag-and-release:
    name: Tag and Create Release
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Enhanced Release Notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ || echo "none")
          echo "## Changes in This Release" > release_notes.txt

          for commit in $(git log --pretty=format:"%H" ${PREVIOUS_TAG}..HEAD); do
            if git log -1 --pretty=%B $commit | grep -q "Merge pull request"; then
              PR_NUMBER=$(git log -1 --pretty=%B $commit | grep -oE "#[0-9]+" | tr -d "#")
              PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/$PR_NUMBER"
              COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s" $commit)
              COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$commit"
              echo "- [$commit]($COMMIT_URL): $COMMIT_MESSAGE ([PR #$PR_NUMBER]($PR_URL))" >> release_notes.txt
            else
              COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s" $commit)
              COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$commit"
              echo "- [$commit]($COMMIT_URL): $COMMIT_MESSAGE" >> release_notes.txt
            fi
          done

          echo "RELEASE_NOTES=$(cat release_notes.txt)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          release_name: "Release ${{ env.RELEASE_VERSION }}"
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
