name: Deploy to Staging (GCP)

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:

  lint:
    name: Lint Code
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Run Tests
    environment: staging
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Load Environment Variables from test.env
        run: |
          if [ -f test.env ]; then
            export $(cat test.env | xargs)
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest in Parallel
        run: pytest -n auto

  build-staging-gcp:
    name: Build and Push Docker Image to GCP Artifact Registry
    environment: staging
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    env:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REPO: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/solidroam-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Derive Image Tag
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/refs\/heads\///' | tr '/' '-')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          IMAGE_TAG="${BRANCH_NAME}-${COMMIT_HASH}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"

          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=gha,scope=cloud-run-build \
            --cache-to=type=gha,mode=max,scope=cloud-run-build \
            -f ./Dockerfile \
            -t "${IMAGE_REPO}:${IMAGE_TAG}" \
            --push .

          echo "✅ Pushed ${IMAGE_REPO}:${IMAGE_TAG}"

  migrate-staging-gcp:
    name: Run Django Migrations on Cloud Run
    environment: staging
    runs-on: ubuntu-latest
    needs: build-staging-gcp
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ needs.build-staging-gcp.outputs.image_tag }}

    env:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/solidroam-app:${{ needs.build-staging-gcp.outputs.image_tag }}

    steps:
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run migrations as Cloud Run Job
        run: |
          set -euo pipefail
          gcloud run jobs deploy solidroam-migrate-staging \
            --image="${IMAGE}" \
            --entrypoint="python" \
            --args="manage.py,migrate,--noinput" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet

          gcloud run jobs execute solidroam-migrate-staging \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --wait \
            --quiet

  deploy-staging-gcp:
    name: Deploy ${{ matrix.service }}
    environment: staging
    runs-on: ubuntu-latest
    needs: migrate-staging-gcp
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: django-app
            role: web
            cpu: "1"
            memory: "1Gi"
            min_instances: "1"
            max_instances: "5"
            no_cpu_throttling: True
          - service: celery-django
            role: worker
            cpu: "1"
            memory: "2Gi"
            min_instances: "1"
            max_instances: "1"
            no_cpu_throttling: true

    env:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/solidroam-app:${{ needs.migrate-staging-gcp.outputs.image_tag }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy ${{ matrix.service }} to Cloud Run
        run: |
          set -euo pipefail
          
          # We explicitly map the matrix service name to the entrypoint argument
          # django-app -> django-app
          # celery-django -> celery-django
          
          gcloud run deploy ${{ matrix.service }} \
            --image="${IMAGE}" \
            --args="${{ matrix.service }}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --cpu="${{ matrix.cpu }}" \
            --memory="${{ matrix.memory }}" \
            --min-instances="${{ matrix.min_instances }}" \
            --max-instances="${{ matrix.max_instances }}" \
            --cpu-boost \
            --no-cpu-throttling \
            --ingress=${{ matrix.role == 'web' && 'all' || 'internal' }} \
            --allow-unauthenticated \
            --quiet

      - name: Verify Service
        run: |
          gcloud run services describe ${{ matrix.service }} \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format="value(status.conditions[0].status)"
