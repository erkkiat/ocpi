name: Manual Release Workflow

on:
  release:
    types:
      - published  # Triggered when a release is manually published via the GitHub UI

jobs:
  build-and-deploy:
    name: Build and Deploy Manual Release
    runs-on: ubuntu-latest

    env:
      ECR_REPO_URL: ${{ secrets.SMP_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.SMP_AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Extract Tag and Release Info
        id: release_info
        run: |
          echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          echo "RELEASE_BODY=${{ github.event.release.body }}" >> $GITHUB_ENV

      - name: Log Release Info
        run: |
          echo "Tag Name: ${{ env.RELEASE_TAG }}"
          echo "Release Notes: ${{ env.RELEASE_BODY }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SMP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SMP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SMP_AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images
        run: |
          IMAGE_TAG=${{ env.RELEASE_TAG }}
          repo_url="$ECR_REPO_URL/solidroam-$service-f1"
          full_image_url_with_tag="$repo_url:$IMAGE_TAG"

          for service in django-app mqtt-subscriber celery-mqtt celery-django; do
              echo "Building multi-architecture image for $service with tag: $IMAGE_TAG"
              docker buildx build --platform linux/arm64 -t "$full_image_url_with_tag" -f ./Dockerfile --push .
              echo "Pushed $service:$IMAGE_TAG to ECR farm $FARM."
          done

  publish-release:
    name: Publish Release After Successful Deployment
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Publish the Draft Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          release_name: "Release ${{ github.event.release.tag_name }}"
          body: ${{ github.event.release.body }}
          draft: false  # Change from draft to published
          prerelease: false
