name: Archive to Escrow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  archive-to-escrow:
    name: Push snapshot to escrow-smappee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ocpiconnector main (full files, no history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure SSH for escrow repo
        env:
          ESCROW_DEPLOY_KEY: ${{ secrets.ESCROW_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ESCROW_DEPLOY_KEY" > ~/.ssh/escrow_deploy_key
          chmod 600 ~/.ssh/escrow_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host escrow-github
            HostName github.com
            User git
            IdentityFile ~/.ssh/escrow_deploy_key
            IdentitiesOnly yes
          EOF

      - name: Push snapshot to escrow-smappee under src/
        env:
          ESCROW_REPO: ${{ github.repository_owner }}/escrow-smappee
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG="escrow: snapshot from ocpiconnector@${COMMIT_SHA:0:7}"

          # Clone escrow repo (with history preserved on escrow side)
          git clone "git@escrow-github:${ESCROW_REPO}.git" escrow-repo

          # Wipe src/ and replace with current ocpiconnector snapshot
          rm -rf escrow-repo/src
          mkdir -p escrow-repo/src
          rsync -a --exclude='.git' --exclude='escrow-repo' . escrow-repo/src/

          cd escrow-repo
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "$COMMIT_MSG"
          git push origin main
