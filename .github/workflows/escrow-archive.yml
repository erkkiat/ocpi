name: Archive to Escrow

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  archive-to-escrow:
    name: Push snapshot to escrow-smappee
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📌 Release tag: ${TAG}"

      - name: Checkout ocpiconnector at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Configure SSH for escrow repo
        env:
          ESCROW_DEPLOY_KEY: ${{ secrets.ESCROW_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ESCROW_DEPLOY_KEY" > ~/.ssh/escrow_deploy_key
          chmod 600 ~/.ssh/escrow_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host escrow-github
            HostName github.com
            User git
            IdentityFile ~/.ssh/escrow_deploy_key
            IdentitiesOnly yes
          EOF
          echo "✅ SSH configured for escrow-github"

      - name: Push snapshot to escrow-smappee under src/
        env:
          ESCROW_REPO: ${{ github.repository_owner }}/escrow-smappee
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          COMMIT_MSG="escrow: snapshot from ocpiconnector@${RELEASE_TAG}"

          echo "📦 Cloning escrow repo: ${ESCROW_REPO}"
          git clone "git@escrow-github:${ESCROW_REPO}.git" escrow-repo

          echo "🗂️ Syncing ocpiconnector snapshot into src/"
          rm -rf escrow-repo/src
          mkdir -p escrow-repo/src
          rsync -a --exclude='.git' --exclude='escrow-repo' . escrow-repo/src/

          FILE_COUNT=$(find escrow-repo/src -type f | wc -l)
          echo "📁 Files synced into src/: ${FILE_COUNT}"

          cd escrow-repo
          git add -A

          if git diff --cached --quiet; then
            echo "⏭️ No changes detected — escrow is already up to date."
            exit 0
          fi

          CHANGED=$(git diff --cached --stat | tail -1)
          echo "📝 Changes: ${CHANGED}"

          git commit -m "$COMMIT_MSG"
          git push origin main

          echo "✅ Escrow updated: ${COMMIT_MSG}"
