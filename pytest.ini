[pytest]
DJANGO_SETTINGS_MODULE = ocpiconnector.settings.tests
addopts = --cov=. --cov-fail-under 62 --cov-report term --cov-report html --maxfail 1 --doctest-modules --disable-warnings --ignore=ocpiconnector/settings/production.py --ignore=ocpiconnector/settings/staging.py
python_files = tests.py test_*.py *_tests.py
env_files =
    test.env
