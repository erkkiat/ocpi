[pytest]
DJANGO_SETTINGS_MODULE = ocpiconnector.settings.tests
addopts = 
    --cov=. 
    --cov-fail-under 69 
    --cov-report term 
    --cov-report html 
    --maxfail 1 
    --doctest-modules 
    --disable-warnings 
    --ignore=ocpiconnector/settings/production.py
    --ignore=ocpiconnector/settings/staging.py
    --ignore=ocpiconnector/settings/gke.py
    --ignore=performancetest/
    --tb=auto
asyncio_mode = auto
doctest_optionflags = ELLIPSIS
python_files = tests.py test_*.py *_tests.py
env_files =
    test.env
