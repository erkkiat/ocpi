repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.6.5
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
- repo: local
  hooks:
    - id: check-missing-migrations
      name: Checking missing Django migrations
      description: This hook checks if changes has been made into models but not reflected into a migration.
      entry: sh -c ". .env-local/django-app.env && python manage.py makemigrations --check --dry-run"
      language: system
      pass_filenames: false
