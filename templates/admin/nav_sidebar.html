{% load i18n %}

<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar" aria-label="{% translate 'Toggle navigation' %}"></button>
<nav class="sticky" id="nav-sidebar">
    <ul class="nav nav-pills flex-column">

        {% for item in admin_menu %}
        <li class="nav-item{% if item.url == '#' %} divider-top{% endif %}">
            <a class="nav-link {% if item.url in request.path %} active{% endif %}" href="{{item.url}}">
                {% if item.url == '#' %}<h5>{{item.name}}</h5>{% else %}{{item.name}} {% endif %}
            </a>
        </li>
        {% endfor %}
    </ul>
</nav>
