version: "3.9"

services:
  db:
    image: postgres:latest
    container_name: ocpi-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8081:8081"

  django-server:
    build:
      context: .
    container_name: django-server
    environment:
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.dev"
    volumes:
      - .:/app
      - static-data:/app/static
      - media-data:/app/media
    ports:
      - "8080:8080"
    command: ["django-server"]

  mqtt-subscriber:
    build:
      context: .
    container_name: mqtt-subscriber
    environment:
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.dev"
      MQTT_BROKER: "localhost"
      MQTT_PORT: "1883"
      MQTT_USERNAME: "dev-username"
      MQTT_PASSWORD: "dev-password"
    command: ["mqtt-subscriber"]

  celery-mqtt:
    build:
      context: .
    container_name: celery-mqtt
    environment:
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.dev"
      BROKER_URL: "redis://redis:6379/0"
    volumes:
      - celery-logs:/var/log/celery
    command: ["celery-mqtt"]

  celery-django:
    build:
      context: .
    container_name: celery-django
    environment:
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.dev"
    volumes:
      - celery-logs:/var/log/celery
    command: ["celery-django"]

volumes:
  pgdata:
  redis-data:
  celery-logs:
  static-data:
  media-data:
