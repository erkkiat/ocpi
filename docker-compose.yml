services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ocpi
      MONGO_INITDB_ROOT_PASSWORD: ocpiocpi
      MONGO_INITDB_DATABASE: ocpi8000
    volumes:
      - mongodata:/data/db
      - ./mongo-init/:/docker-entrypoint-initdb.d/
    networks:
      - db-network
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ocpi
      ME_CONFIG_MONGODB_ADMINPASSWORD: ocpiocpi
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - db-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  db:
    image: postgres
    container_name: ocpi-postgres
    restart: always
    environment:
      POSTGRES_USER: ocpi
      POSTGRES_PASSWORD: ocpiocpi
      POSTGRES_DB: ocpi8000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
#      networks:
#        - app-network
    ports:
      - 5432:5432
#      network_mode: "host"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis
    restart: unless-stopped

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"  # MQTT port
      - "8083:8083"  # WebSocket port
      - "8081:8081"  # Dashboard port
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=node1
      - EMQX_NODE__COOKIE=secretcookie
      - EMQX_LOADED_PLUGINS=emqx_management,emqx_recon,emqx_retainer,emqx_dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

networks:
  db-network:

volumes:
  redis-data:
  mongodata:
  pgdata:
  emqx_data:
  emqx_log:

