apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ocpiconnector-secrets
  # namespace is set by the overlay
spec:
  provider: gke
  parameters:
    # Each entry maps to one secret in GCP Secret Manager.
    # Secrets use flat names (e.g. DATABASE_URL) shared across environments.
    # PROJECT_NUMBER (not PROJECT_ID) is required by the GCP CSI provider.
    # The secrets block is replaced entirely per overlay via kustomize patch.
    # NOTE: field is "path" (GKE managed CSI), not "fileName" (open-source driver).
    secrets: |
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/DATABASE_URL/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/REDIS_URL/versions/latest"
        path: "REDIS_URL"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/SECRET_KEY/versions/latest"
        path: "SECRET_KEY"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ALLOWED_HOSTS/versions/latest"
        path: "ALLOWED_HOSTS"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/HUBJECT_CLIENT_CERTIFICATE/versions/latest"
        path: "HUBJECT_CLIENT_CERTIFICATE"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/HUBJECT_PRIVATE_KEY/versions/latest"
        path: "HUBJECT_PRIVATE_KEY"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/HUBJECT_CA_CERTIFICATE/versions/latest"
        path: "HUBJECT_CA_CERTIFICATE"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/SENTRY_DSN/versions/latest"
        path: "SENTRY_DSN"
  # The CSI driver syncs each mounted file into a native k8s Secret.
  # objectName must match the path above.
  # Pods consume the resulting k8s Secret via envFrom: secretRef.
  secretObjects:
    - secretName: ocpiconnector-env
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
        - objectName: "REDIS_URL"
          key: "REDIS_URL"
        - objectName: "SECRET_KEY"
          key: "SECRET_KEY"
        - objectName: "ALLOWED_HOSTS"
          key: "ALLOWED_HOSTS"
        - objectName: "HUBJECT_CLIENT_CERTIFICATE"
          key: "HUBJECT_CLIENT_CERTIFICATE"
        - objectName: "HUBJECT_PRIVATE_KEY"
          key: "HUBJECT_PRIVATE_KEY"
        - objectName: "HUBJECT_CA_CERTIFICATE"
          key: "HUBJECT_CA_CERTIFICATE"
        - objectName: "SENTRY_DSN"
          key: "SENTRY_DSN"
