apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ocpiconnector-secrets
  # namespace is set by the overlay
spec:
  provider: gcp
  parameters:
    # Each entry maps to one secret in GCP Secret Manager.
    # Naming pattern: ocpi-gateway-{ENV}-{VAR_NAME}
    # PROJECT_NUMBER (not PROJECT_ID) is required by the GCP CSI provider.
    # The secrets block is replaced entirely per overlay via kustomize patch.
    secrets: |
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-ENV-DATABASE_URL/versions/latest"
        fileName: "DATABASE_URL"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-ENV-REDIS_URL/versions/latest"
        fileName: "REDIS_URL"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-ENV-DJANGO_SECRET_KEY/versions/latest"
        fileName: "DJANGO_SECRET_KEY"
      - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-ENV-ALLOWED_HOSTS/versions/latest"
        fileName: "ALLOWED_HOSTS"
  # The CSI driver syncs each mounted file into a native k8s Secret.
  # objectName must match the fileName above.
  # Pods consume the resulting k8s Secret via envFrom: secretRef.
  secretObjects:
    - secretName: ocpiconnector-env
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
        - objectName: "REDIS_URL"
          key: "REDIS_URL"
        - objectName: "DJANGO_SECRET_KEY"
          key: "DJANGO_SECRET_KEY"
        - objectName: "ALLOWED_HOSTS"
          key: "ALLOWED_HOSTS"
