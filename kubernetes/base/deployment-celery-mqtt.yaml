apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-mqtt
  labels:
    app: celery-mqtt
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-mqtt
  template:
    metadata:
      labels:
        app: celery-mqtt
        component: worker
    spec:
      serviceAccountName: ocpiconnector-ksa
      terminationGracePeriodSeconds: 120
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ocpiconnector-secrets
      containers:
        - name: celery-mqtt
          image: solidroam-app
          args: ["celery-mqtt"]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          envFrom:
            - secretRef:
                name: ocpiconnector-env
          env:
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CELERY_QUEUE_NAME
              value: "HIGH"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "celery -A ocpi22.cpo.mqtt.tasks inspect ping -d celery-mqtt@$HOSTNAME --timeout 10"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
