apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ocpiconnector-secret-store
  # namespace is set by the overlay
spec:
  provider:
    gcpsm:
      # PROJECT_ID is patched per overlay via kustomize patch.
      # Workload Identity on ocpiconnector-ksa provides authentication — no explicit credentials needed.
      projectID: REPLACE_WITH_PROJECT_ID
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ocpiconnector-secrets
  # namespace is set by the overlay
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ocpiconnector-secret-store
    kind: SecretStore
  target:
    name: ocpiconnector-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: REDIS_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: SECRET_KEY
    - secretKey: ALLOWED_HOSTS
      remoteRef:
        key: ALLOWED_HOSTS
    - secretKey: HUBJECT_CLIENT_CERTIFICATE
      remoteRef:
        key: HUBJECT_CLIENT_CERTIFICATE
    - secretKey: HUBJECT_PRIVATE_KEY
      remoteRef:
        key: HUBJECT_PRIVATE_KEY
    - secretKey: HUBJECT_CA_CERTIFICATE
      remoteRef:
        key: HUBJECT_CA_CERTIFICATE
    - secretKey: SENTRY_DSN
      remoteRef:
        key: SENTRY_DSN
