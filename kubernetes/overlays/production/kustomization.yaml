apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml

images:
  - name: solidroam-app
    newName: REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/solidroam-app
    newTag: v0.0.0  # replaced by CI with immutable release tag from release-drafter

patches:
  # ServiceAccount — Workload Identity binding for production GCP SA
  - target:
      kind: ServiceAccount
      name: ocpiconnector-ksa
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: ocpiconnector-production@PROJECT_ID.iam.gserviceaccount.com

  # SecretStore — production GCP project for External Secrets Operator
  - target:
      kind: SecretStore
      name: ocpiconnector-secret-store
    patch: |-
      - op: replace
        path: /spec/provider/gcpsm/projectID
        value: REPLACE_WITH_PROJECT_ID

  # django-app — scale up replicas for production
  - target:
      kind: Deployment
      name: django-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
