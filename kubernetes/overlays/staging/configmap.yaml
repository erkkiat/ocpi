apiVersion: v1
kind: ConfigMap
metadata:
  name: ocpiconnector-config
  namespace: staging
data:
  DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.gke"
  HOSTNAME: "${HOSTNAME}"
  SCHEME: "https"
  ENV: "staging"
  DEBUG: "False"
  PYTHONUNBUFFERED: "1"
  BACKGROUND_SEND: "${BACKGROUND_SEND}"
  LOCAL_STATIC: "${LOCAL_STATIC}"
  SIMULATOR: "${SIMULATOR}"
  BUSINESS_NAME: "${BUSINESS_NAME}"
  CPO: "${CPO}"
  EMSP: "${EMSP}"
  REFRESH_RDS_TOKEN_FOR_TASKS: "${REFRESH_RDS_TOKEN_FOR_TASKS}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS}"
  CELERY_QUEUE_NAME: "${CELERY_QUEUE_NAME}"
