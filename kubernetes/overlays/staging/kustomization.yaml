apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml

images:
  - name: solidroam-app
    newName: europe-southwest1-docker.pkg.dev/solidroam-staging/solidroam-docker/solidroam-app
    newTag: develop-000000  # replaced by CI with immutable tag: {branch}-{sha}

patches:
  # ServiceAccount — Workload Identity binding for staging GCP SA
  - target:
      kind: ServiceAccount
      name: ocpiconnector-ksa
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: ocpiconnector-app@solidroam-staging.iam.gserviceaccount.com

  # SecretStore — staging GCP project for External Secrets Operator
  - target:
      kind: SecretStore
      name: ocpiconnector-secret-store
    patch: |-
      - op: replace
        path: /spec/provider/gcpsm/projectID
        value: solidroam-staging

  # django-app — 1 replica is enough for staging
  - target:
      kind: Deployment
      name: django-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
