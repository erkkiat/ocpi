apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - ingress.yaml

images:
  - name: solidroam-app
    newName: REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/solidroam-app
    newTag: latest  # replaced by CI with immutable tag

patches:
  # ServiceAccount — Workload Identity binding for staging GCP SA
  - target:
      kind: ServiceAccount
      name: ocpiconnector-ksa
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: ocpiconnector-staging@PROJECT_ID.iam.gserviceaccount.com

  # SecretProviderClass — staging secrets from GCP Secret Manager
  - target:
      kind: SecretProviderClass
      name: ocpiconnector-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/secrets
        value: |
          - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-staging-DATABASE_URL/versions/latest"
            fileName: "DATABASE_URL"
          - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-staging-REDIS_URL/versions/latest"
            fileName: "REDIS_URL"
          - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-staging-DJANGO_SECRET_KEY/versions/latest"
            fileName: "DJANGO_SECRET_KEY"
          - resourceName: "projects/REPLACE_WITH_PROJECT_NUMBER/secrets/ocpi-gateway-staging-ALLOWED_HOSTS/versions/latest"
            fileName: "ALLOWED_HOSTS"
          # Add the rest of your env vars here following the same pattern

  # django-app — 1 replica is enough for staging
  - target:
      kind: Deployment
      name: django-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
