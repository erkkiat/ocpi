apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml

images:
  - name: solidroam-app
    newName: europe-southwest1-docker.pkg.dev/solidroam-staging/solidroam-docker/solidroam-app
    newTag: develop-000000  # replaced by CI with immutable tag: {branch}-{sha}

patches:
  # ServiceAccount — Workload Identity binding for staging GCP SA
  - target:
      kind: ServiceAccount
      name: ocpiconnector-ksa
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: ocpiconnector-app@solidroam-staging.iam.gserviceaccount.com

  # SecretProviderClass — staging secrets from GCP Secret Manager
  - target:
      kind: SecretProviderClass
      name: ocpiconnector-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/secrets
        value: |
          - resourceName: "projects/1085904235718/secrets/DATABASE_URL/versions/latest"
            path: "DATABASE_URL"
          - resourceName: "projects/1085904235718/secrets/REDIS_URL/versions/latest"
            path: "REDIS_URL"
          - resourceName: "projects/1085904235718/secrets/SECRET_KEY/versions/latest"
            path: "SECRET_KEY"
          - resourceName: "projects/1085904235718/secrets/ALLOWED_HOSTS/versions/latest"
            path: "ALLOWED_HOSTS"
          - resourceName: "projects/1085904235718/secrets/HUBJECT_CLIENT_CERTIFICATE/versions/latest"
            path: "HUBJECT_CLIENT_CERTIFICATE"
          - resourceName: "projects/1085904235718/secrets/HUBJECT_PRIVATE_KEY/versions/latest"
            path: "HUBJECT_PRIVATE_KEY"
          - resourceName: "projects/1085904235718/secrets/HUBJECT_CA_CERTIFICATE/versions/latest"
            path: "HUBJECT_CA_CERTIFICATE"
          - resourceName: "projects/1085904235718/secrets/SENTRY_DSN/versions/latest"
            path: "SENTRY_DSN"

  # django-app — 1 replica is enough for staging
  - target:
      kind: Deployment
      name: django-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
