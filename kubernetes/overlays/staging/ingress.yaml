apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: ocpiconnector-cert
  namespace: staging
spec:
  domains:
    - staging.api.ocpi-gateway.solidroam.fi  # replace with your actual staging domain
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-app-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "ocpiconnector-cert"
    # Create the static IP first:
    # gcloud compute addresses create ocpiconnector-staging-ip --global --project=PROJECT_ID
    kubernetes.io/ingress.global-static-ip-name: "ocpiconnector-staging-ip"
spec:
  rules:
    - host: staging.api.ocpi-gateway.solidroam.fi  # replace with your actual staging domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-app
                port:
                  number: 80
