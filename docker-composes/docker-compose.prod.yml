version: "3.9"

services:
  django-server:
    build:
      context: ../
    image: solidroam/django-app:latest
    container_name: django-server
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: django-server  # Matches the case in entrypoint.sh
    networks:
      - app-network

  mqtt-subscriber:
    build:
      context: ../
    image: solidroam/mqtt-subscriber:latest
    container_name: mqtt-subscriber
    volumes:
      - mqtt_logs:/var/log/mqtt
    command: mqtt-subscriber  # Matches the case in entrypoint.sh
    networks:
      - app-network

  celery-mqtt-tasks:
    build:
      context: ../
    image: solidroam/celery-mqtt:latest
    container_name: celery-mqtt
    volumes:
      - celery_logs:/var/log/celery
    command: celery-mqtt  # Matches the case in entrypoint.sh
    networks:
      - app-network

  celery-django-tasks:
    build:
      context: ../
    image: solidroam/celery-django:latest
    container_name: celery-django
    volumes:
      - celery_logs:/var/log/celery
    command: celery-django  # Matches the case in entrypoint.sh
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: ocpi-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  mqtt_logs:

networks:
  app-network:
