version: "3.9"

services:
  django-server:
    build:
      context: ../
    image: solidroam/django-app:prod-latest
    container_name: django-server
    environment:
      ENV: production
      AWS_SECRET_ID: "django-server-secrets"
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: ["django-server"]
    networks:
      - app-network

  mqtt-subscriber:
    build:
      context: ../
    image: solidroam/mqtt-subscriber:prod-latest
    container_name: mqtt-subscriber
    environment:
      ENV: production
      AWS_SECRET_ID: "mqtt-subscriber-secrets"
    volumes:
      - mqtt_logs:/var/log/mqtt
    command: ["mqtt-subscriber"]
    networks:
      - app-network

  celery-mqtt-tasks:
    build:
      context: ../
    image: solidroam/celery-mqtt:prod-latest
    container_name: celery-mqtt
    environment:
      ENV: production
      AWS_SECRET_ID: "mqtt-celery-secrets"
      WORKER_NAME: "celery-mqtt-worker"
    volumes:
      - celery_logs:/var/log/celery
    command: ["celery-mqtt"]
    networks:
      - app-network

  celery-django-tasks:
    build:
      context: ../
    image: solidroam/celery-django:prod-latest
    container_name: celery-django
    environment:
      ENV: production
      WORKER_NAME: "celery-django-worker"
      AWS_SECRET_ID: "django-celery-secrets"
    volumes:
      - celery_logs:/var/log/celery
    command: ["celery-django"]
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  mqtt_logs:

networks:
  app-network:
