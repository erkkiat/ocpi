version: "3.9"

services:
  django-app:
    image: "${ECR_REPO_URL}/django-app:${IMAGE_TAG}"
    container_name: django-app
    environment:
      ENV: production
      AWS_SECRET_ID: "django-app-secrets"
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.production"
      DJANGO_PORT: "${DJANGO_PORT:-8000}"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: ["django-app"]
    networks:
      - app-network

  mqtt-subscriber:
    image: "${ECR_REPO_URL}/mqtt-subscriber:${IMAGE_TAG}"
    container_name: mqtt-subscriber
    environment:
      ENV: production
      AWS_SECRET_ID: "mqtt-subscriber-secrets"
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.production"
    volumes:
      - mqtt_logs:/var/log/mqtt
    command: ["mqtt-subscriber"]
    networks:
      - app-network

  celery-mqtt-tasks:
    image: "${ECR_REPO_URL}/celery-mqtt:${IMAGE_TAG}"
    container_name: celery-mqtt
    environment:
      ENV: production
      AWS_SECRET_ID: "mqtt-celery-secrets"
      WORKER_NAME: "celery-mqtt-worker-high"
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.production"
    volumes:
      - celery_logs:/var/log/celery
    command: ["celery-mqtt"]
    networks:
      - app-network

  celery-django-tasks:
    image: "${ECR_REPO_URL}/celery-django:${IMAGE_TAG}"
    container_name: celery-django
    environment:
      ENV: production
      AWS_SECRET_ID: "django-celery-secrets"
      WORKER_NAME: "celery-django-worker"
      DJANGO_SETTINGS_MODULE: "ocpiconnector.settings.production"

    volumes:
      - celery_logs:/var/log/celery
    command: ["celery-django"]
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  mqtt_logs:

networks:
  app-network:
