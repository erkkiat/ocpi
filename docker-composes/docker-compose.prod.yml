version: "3.9"

services:
  django-server:
    build:
      context: ../
    image: solidroam/django-app:prod-latest
    container_name: django-server
    environment:
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: django-server
    networks:
      - app-network

  mqtt-subscriber:
    build:
      context: ../
    image: solidroam/mqtt-subscriber:prod-latest
    container_name: mqtt-subscriber
    volumes:
      - mqtt_logs:/var/log/mqtt
    command: mqtt-subscriber
    networks:
      - app-network

  celery-mqtt-tasks:
    build:
      context: ../
    image: solidroam/celery-mqtt:prod-latest
    container_name: celery-mqtt
    environment:
      WORKER_NAME: "celery-mqtt-worker"
      CELERY_QUEUE_NAME: "${CELERY_MQTT_QUEUE_NAME}"
    volumes:
      - celery_logs:/var/log/celery
    command: celery-mqtt
    networks:
      - app-network

  celery-django-tasks:
    build:
      context: ../
    image: solidroam/celery-django:prod-latest
    container_name: celery-django
    environment:
      WORKER_NAME: "celery-django-worker"
      CELERY_QUEUE_NAME: "${CELERY_DJANGO_QUEUE_NAME}"
    volumes:
      - celery_logs:/var/log/celery
    command: celery-django
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: ocpi-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  mqtt_logs:

networks:
  app-network:
