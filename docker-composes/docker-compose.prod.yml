version: "3.9"

services:
  django-server:
    image: solidroam/django-app:latest
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    command: gunicorn ocpiconnector.wsgi:application --bind 0.0.0.0:8000
    networks:
      - app-network

  mqtt-subscriber:
    image: solidroam/mqtt-subscriber:latest
    volumes:
      - mqtt_logs:/var/log/mqtt
    command: python ocpiconnector/ocpi22/cpo/mqtt/mqtt_subscriber.py
    networks:
      - app-network

  celery-mqtt-tasks:
    image: solidroam/celery-mqtt:latest
    volumes:
      - celery_logs:/var/log/celery
    command: celery -A ocpiconnector.ocpi22.cpo.mqtt.tasks worker --loglevel=info
    networks:
      - app-network

  celery-django-tasks:
    image: solidroam/celery-django:latest
    volumes:
      - celery_logs:/var/log/celery
    command: celery -A ocpiconnector worker --loglevel=info
    networks:
      - app-network

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    networks:
      - app-network

# Change it to mysql later on
  db:
    image: postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  mqtt_logs:

networks:
  app-network:
