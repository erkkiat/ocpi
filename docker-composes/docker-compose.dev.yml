version: "3.9"

services:
  django-server:
    build:
      context: ../  # Adjusted build context to root of project
    container_name: django-server
    env_file:
      - ../.env  # Adjusted to load .env from root directory
    environment:
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
    volumes:
      - ../:/app  # Adjusted to mount root project directory
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: gunicorn ocpiconnector.wsgi:application --bind 0.0.0.0:8000
    networks:
      - app-network

  mqtt-subscriber:
    build:
      context: ../  # Adjusted build context to root of project
    container_name: mqtt-subscriber
    env_file:
      - ../.env  # Adjusted to load .env from root directory
    volumes:
      - ../:/app  # Adjusted to mount root project directory
    command: python ocpiconnector/ocpi22/cpo/mqtt/mqtt_subscriber.py
    networks:
      - app-network

  celery-mqtt-tasks:
    build:
      context: ../  # Adjusted build context to root of project
    container_name: celery-mqtt
    env_file:
      - ../.env  # Adjusted to load .env from root directory
    volumes:
      - ../:/app  # Adjusted to mount root project directory
      - celery_logs:/var/log/celery
    command: celery -A ocpiconnector.ocpi22.cpo.mqtt.tasks worker --loglevel=info
    networks:
      - app-network

  celery-django-tasks:
    build:
      context: ../  # Adjusted build context to root of project
    container_name: celery-django
    env_file:
      - ../.env  # Adjusted to load .env from root directory
    volumes:
      - ../:/app  # Adjusted to mount root project directory
      - celery_logs:/var/log/celery
    command: celery -A ocpiconnector worker --loglevel=info
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - ../.env  # Adjusted to load .env from root directory
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: ocpi-postgres
    env_file:
      - ../.env  # Adjusted to load .env from root directory
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:

networks:
  app-network:
