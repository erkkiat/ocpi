version: "3.9"

services:
  django-server:
    build:
      context: ../  # Points to the project root
    container_name: django-server
    environment:
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
      ENV: development
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    command: django-server  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  mqtt-subscriber:
    build:
      context: ../  # Points to the project root
    container_name: mqtt-subscriber
    environment:
      ENV: development
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
    command: mqtt-subscriber  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  celery-mqtt-tasks:
    build:
      context: ../  # Points to the project root
    container_name: celery-mqtt
    environment:
      ENV: development
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
      - celery_logs:/var/log/celery
    command: celery-mqtt  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  celery-django-tasks:
    build:
      context: ../  # Points to the project root
    container_name: celery-django
    environment:
      ENV: development
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
      - celery_logs:/var/log/celery
    command: celery-django  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: ocpi-postgres
    environment:
      POSTGRES_USER: ocpi
      POSTGRES_PASSWORD: ocpiocpi
      POSTGRES_DB: ocpi8000
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"  # MQTT port
      - "8083:8083"  # WebSocket port
      - "8081:8081"  # Dashboard port
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=node1
      - EMQX_NODE__COOKIE=secretcookie
      - EMQX_LOADED_PLUGINS=emqx_management,emqx_recon,emqx_retainer,emqx_dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  emqx_data:
  emqx_log:

networks:
  app-network:
