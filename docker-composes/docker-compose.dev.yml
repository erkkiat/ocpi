version: "3.9"

services:
  django-server:
    build:
      context: ../  # Points to the project root
    container_name: django-server
    env_file:
      - ../.env  # Load .env from the root directory
    environment:
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    command: django-server  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  mqtt-subscriber:
    build:
      context: ../  # Points to the project root
    container_name: mqtt-subscriber
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
    command: mqtt-subscriber  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  celery-mqtt-tasks:
    build:
      context: ../  # Points to the project root
    container_name: celery-mqtt
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
      - celery_logs:/var/log/celery
    command: celery-mqtt  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  celery-django-tasks:
    build:
      context: ../  # Points to the project root
    container_name: celery-django
    volumes:
      - ../:/app  # Mount the root project directory for live reloading
      - celery_logs:/var/log/celery
    command: celery-django  # Matches the keyword in entrypoint.sh
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - ../.env  # Load .env from the root directory
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: ocpi-postgres
    env_file:
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:

networks:
  app-network:
