version: "3.9"

services:
  django-app:
    build:
      context: ../
    container_name: django-app
    environment:
      DJANGO_COLLECT_STATIC: "true"
      DJANGO_MIGRATE: "true"
      ENV: development
      GUNICORN_CMD_ARGS: "--reload"
    env_file:
      - ../.env-local/django-app.env
    volumes:
      - ../:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - xlm_models:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command: django-app
    networks:
      - backend-network
      - db-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  mqtt-subscriber:
    build:
      context: ../
    container_name: mqtt-subscriber
    environment:
      ENV: development
    env_file:
      - ../.env-local/mqtt-subscriber.env
    volumes:
      - ../:/app
    command: mqtt-subscriber
    networks:
      - backend-network
      - db-network
    depends_on:
      - emqx
      - db

  celery-mqtt-tasks:
    build:
      context: ../
    container_name: celery-mqtt
    environment:
      ENV: development
    env_file:
      - ../.env-local/celery-mqtt.env
    volumes:
      - ../:/app
      - celery_logs:/var/log/celery
    command: celery-mqtt
    networks:
      - backend-network
      - db-network
    depends_on:
      - redis
      - db

  celery-django-tasks:
    build:
      context: ../
    container_name: celery-django
    environment:
      ENV: development
      CELERY_QUEUE_NAME: django_tasks
      WORKER_HOSTNAME: django_worker
    env_file:
      - ../.env-local/celery-django.env
    volumes:
      - ../:/app
      - celery_logs:/var/log/celery
    command: celery-django
    networks:
      - backend-network
      - db-network
    depends_on:
      - redis
      - db

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network

  db:
    image: postgres:latest
    container_name: ocpi-postgres
    environment:
      POSTGRES_USER: ocpi
      POSTGRES_PASSWORD: ocpiocpi
      POSTGRES_DB: ocpi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../init.sql:/docker-entrypoint-initdb.d/init.sql  # Adjusted path
    ports:
      - "5432:5432"
    networks:
      - db-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ocpi" ]
      interval: 10s
      timeout: 5s
      retries: 5


  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"  # MQTT port
      - "8083:8083"  # WebSocket port
      - "18083:18083"  # Dashboard port
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=node1
      - EMQX_NODE__COOKIE=secretcookie
      - EMQX_LOADED_PLUGINS=emqx_management,emqx_recon,emqx_retainer,emqx_dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - backend-network

volumes:
  static_volume:
  media_volume:
  pgdata:
  redis_data:
  celery_logs:
  emqx_data:
  emqx_log:
  xlm_models:

networks:
  backend-network:
    driver: bridge
  db-network:
    driver: bridge
